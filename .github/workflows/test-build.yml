name: Beta build

# Every push to main republishes the app under one fixed "beta" pre-release, so
# the owner always has the same download link for the newest beta:
# https://github.com/<owner>/<repo>/releases/download/beta/latch-android.apk
# The file keeps its old name on purpose: run_number numbers the builds, and a
# renamed workflow file would start again at 1, below builds already installed.
# It is a release build (minified, https only), signed with the release key,
# so it installs over the previous test build and later over public releases.
# latch-update.json next to the APK is what the app's updater reads
# (apps/android/.../update/Updater.kt); each build's version code is higher
# than the last, so the app can tell that a newer build exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Runner images preset ANDROID_SDK_ROOT to another SDK; AGP rejects a mismatch.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Restore the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.LATCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
        run: |
          # Android installs an update only when it carries the same key as the
          # installed app, and refuses unsigned APKs, so there is nothing to publish without it.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the LATCH_KEYSTORE_BASE64 and LATCH_KEYSTORE_PASSWORD repository secrets (docs/platform/android.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/latch.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/latch.jks" -storepass "$KEYSTORE_PASSWORD" -alias latch | grep -m1 'SHA256:' \
            || { echo "::error::LATCH_KEYSTORE_BASE64 is not a keystore with alias latch, or LATCH_KEYSTORE_PASSWORD does not open it."; exit 1; }
          echo "LATCH_KEYSTORE_PATH=$RUNNER_TEMP/latch.jks" >> "$GITHUB_ENV"
      - name: Number this build
        run: |
          # run_number only grows; +100 keeps every CI build above local builds (version code 1).
          echo "LATCH_VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_ENV"
          echo "LATCH_VERSION_NAME=0.1.0-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "LATCH_UPDATE_MANIFEST_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/beta/latch-update.json" >> "$GITHUB_ENV"
      - working-directory: apps/android
        env:
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish to the beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk latch-android.apk
          sha256sum latch-android.apk > latch-android.apk.sha256
          jq -n \
            --argjson code "$LATCH_VERSION_CODE" \
            --arg name "$LATCH_VERSION_NAME" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/beta/latch-android.apk" \
            --arg sha "$(cut -d' ' -f1 latch-android.apk.sha256)" \
            --argjson size "$(stat -c %s latch-android.apk)" \
            --arg commit "${GITHUB_SHA::7}" \
            '{version_code: $code, version_name: $name, apk_url: $url, sha256: $sha, size: $size, commit: $commit}' > latch-update.json
          notes="Latch $LATCH_VERSION_NAME (${GITHUB_SHA::7}), the newest beta for testing on your own phone. Android 11+. Signed release build; updates from inside the app. Not a stable release: CI checks run in ci.yml, and the real-device checklist is in docs/platform/android.md."
          gh release delete beta --cleanup-tag --yes || true
          gh release create beta latch-android.apk latch-android.apk.sha256 latch-update.json \
            --prerelease --target "$GITHUB_SHA" --title "Latch beta" --notes "$notes"
          # Builds up to 0.1.0-test.12 look for updates under test-build; keep it as a copy
          # (same manifest, which points at the beta download) so they still find this one.
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build latch-android.apk latch-android.apk.sha256 latch-update.json \
            --prerelease --target "$GITHUB_SHA" --title "Latch beta (old link)" \
            --notes "Moved: download the beta from the beta release. This copy keeps older test builds updating."
