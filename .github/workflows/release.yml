name: Release

# Tag vX.Y.Z on main to publish. Produces: gateway binary, container image on
# GHCR, Android APK (signed when the signing secrets exist), SHA256SUMS, an
# SPDX SBOM, and build-provenance attestations for every artifact.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p latch-gateway -p latch-fake-device
      - run: |
          mkdir dist
          cp target/release/latch-gateway dist/latch-gateway-linux-x86_64
          cp target/release/latch-fake-device dist/latch-fake-device-linux-x86_64
      - uses: actions/upload-artifact@v5
        with: { name: gateway, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Runner images preset ANDROID_SDK_ROOT to another SDK; AGP rejects a mismatch.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.LATCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/latch.jks"
            echo "LATCH_KEYSTORE_PATH=$RUNNER_TEMP/latch.jks" >> "$GITHUB_ENV"
          fi
      - working-directory: apps/android
        env:
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
          LATCH_KEY_ALIAS: ${{ secrets.LATCH_KEY_ALIAS }}
          LATCH_KEY_PASSWORD: ${{ secrets.LATCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - run: |
          mkdir dist
          for f in apps/android/app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/latch-android-${GITHUB_REF_NAME}$( [[ $f == *unsigned* ]] && echo -unsigned ).apk"
          done
      - uses: actions/upload-artifact@v5
        with: { name: android, path: dist/* }

  container:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/latch-gateway:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/latch-gateway:latest
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/latch-gateway
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [gateway, android, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: dist, merge-multiple: true }
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/latch-sbom.spdx.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Latch $GITHUB_REF_NAME" \
            --notes "Container: ghcr.io/${{ github.repository_owner }}/latch-gateway@${{ needs.container.outputs.digest }}. Verify with: gh attestation verify <file> --repo ${{ github.repository }}. See docs/operations/release.md."
