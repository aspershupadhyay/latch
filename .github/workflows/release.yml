name: Release

# Tag vX.Y.Z on main to publish. Produces: gateway binary, container image on
# GHCR, Android APK (signed when the signing secrets exist), SHA256SUMS, an
# SPDX SBOM, and build-provenance attestations for every artifact.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p latch-gateway -p latch-fake-device
      - run: |
          mkdir dist
          cp target/release/latch-gateway dist/latch-gateway-linux-x86_64
          cp target/release/latch-fake-device dist/latch-fake-device-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gateway, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Runner images preset ANDROID_SDK_ROOT to another SDK; AGP rejects a mismatch.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.LATCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/latch.jks"
            echo "LATCH_KEYSTORE_PATH=$RUNNER_TEMP/latch.jks" >> "$GITHUB_ENV"
          fi
      - name: Number this release
        run: |
          # vX.Y.Z -> X*1000000 + Y*1000 + Z, so every release is newer than the last
          # and the in-app updater can compare them.
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#v}"
          echo "LATCH_VERSION_CODE=$(( major * 1000000 + minor * 1000 + ${patch%%[!0-9]*} ))" >> "$GITHUB_ENV"
          echo "LATCH_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - working-directory: apps/android
        env:
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
          LATCH_KEY_ALIAS: ${{ secrets.LATCH_KEY_ALIAS }}
          LATCH_KEY_PASSWORD: ${{ secrets.LATCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - run: |
          mkdir dist
          for f in apps/android/app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/latch-android-${GITHUB_REF_NAME}$( [[ $f == *unsigned* ]] && echo -unsigned ).apk"
          done
          # What the app's updater reads from the newest published release; only a signed APK can update.
          apk="dist/latch-android-${GITHUB_REF_NAME}.apk"
          if [ -f "$apk" ]; then
            jq -n \
              --argjson code "$LATCH_VERSION_CODE" \
              --arg name "$LATCH_VERSION_NAME" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/latch-android-$GITHUB_REF_NAME.apk" \
              --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$apk")" \
              --arg commit "${GITHUB_SHA::7}" \
              '{version_code: $code, version_name: $name, apk_url: $url, sha256: $sha, size: $size, commit: $commit}' > dist/latch-update.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: android, path: dist/* }

  container:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/latch-gateway:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/latch-gateway:latest
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/latch-gateway
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [gateway, android, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/latch-sbom.spdx.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Latch $GITHUB_REF_NAME" \
            --notes "Container: ghcr.io/${{ github.repository_owner }}/latch-gateway@${{ needs.container.outputs.digest }}. Verify with: gh attestation verify <file> --repo ${{ github.repository }}. See docs/operations/release.md."
