name: Release

# Tag vX.Y.Z on main to publish. Produces: the gateway with the `latch` command
# for macOS, Linux, and Windows (archives the packages install), container image
# on GHCR, Android APK (signed when the signing secrets exist), the Homebrew,
# Scoop, and winget manifests, SHA256SUMS, an SPDX SBOM, and build-provenance
# attestations for every artifact. The Homebrew, Scoop, and winget packages are
# installed for real before anything is published, and a pull request brings the new
# manifests to main once the release is out (docs/install.md).
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: everything
# is built, tested, signed, summed, and given an SBOM, but nothing is pushed,
# attested, or released; the files are kept as a workflow artifact for a week.
# See docs/operations/release.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to number the dry-run build with (X.Y.Z)"
        default: "0.1.0"

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p latch-gateway -p latch-fake-device
      - run: |
          mkdir dist
          cp target/release/latch-gateway dist/latch-gateway-linux-x86_64
          cp target/release/latch-fake-device dist/latch-fake-device-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gateway, path: dist/* }

  # What the packages and a manual download install: latch-gateway and the `latch`
  # command (packaging/), with LICENSE and NOTICE.
  archives:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64 }
          # Apple's toolchain on the arm64 runner builds x86_64 too.
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup target add ${{ matrix.target }}
        shell: bash
      - run: cargo build --release --locked -p latch-gateway --target ${{ matrix.target }}
        shell: bash
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          name="latch-$TAG-${{ matrix.platform }}"
          mkdir -p "$name" dist
          cp "target/${{ matrix.target }}/release/latch-gateway" packaging/latch LICENSE NOTICE "$name/"
          chmod 755 "$name/latch-gateway" "$name/latch"
          # Apple Silicon runs only signed programs: sign ad hoc and check it.
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "$name/latch-gateway" && codesign --verify "$name/latch-gateway"; fi
          tar -czf "dist/$name.tar.gz" "$name"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "latch-$env:TAG-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $name, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/latch-gateway.exe", packaging/latch.ps1, packaging/latch.cmd, LICENSE, NOTICE $name
          Compress-Archive -Path "$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "archive-${{ matrix.platform }}", path: dist/* }

  # Installs the Homebrew package for real, from the archives just built, before
  # anything is published.
  homebrew:
    needs: archives
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { path: dist, pattern: "archive-*", merge-multiple: true }
      - run: |
          (cd dist && python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          packaging/render.sh "$TAG" dist http://127.0.0.1:8000 pkg
          # Homebrew installs formulae only from a tap: a local one, as `brew tap` would make.
          brew tap-new --no-git latch-ci/test
          cp pkg/Formula/latch.rb "$(brew --repository)/Library/Taps/latch-ci/homebrew-test/Formula/"
          brew install latch-ci/test/latch
          brew test latch-ci/test/latch
          latch version
          latch keys
          grep -q 'LATCH_MCP_TOKEN=lgt' ~/.latch/latch.env
          latch run >gateway.log 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/healthz >/dev/null || { cat gateway.log; exit 1; }
          latch stop
          latch uninstall --all
          if brew list latch-ci/test/latch 2>/dev/null; then echo "latch uninstall left the package"; exit 1; fi
          test ! -e ~/.latch

  # The same for Scoop on Windows, including background start and its update hooks.
  scoop:
    needs: archives
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { path: dist, pattern: "archive-*", merge-multiple: true }
      - run: packaging/render.sh "$TAG" dist http://127.0.0.1:8000 pkg
        shell: bash
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -WindowStyle Hidden python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1' -WorkingDirectory dist
          Invoke-Expression "& {$(Invoke-RestMethod -UseBasicParsing https://get.scoop.sh)} -RunAsAdmin"
          scoop install .\pkg\bucket\latch.json
          latch version; if ($LASTEXITCODE -ne 0) { throw 'latch version failed' }
          latch keys
          if ((Get-Content -Raw (Join-Path $env:USERPROFILE '.latch\latch.env')) -notmatch 'LATCH_MCP_TOKEN=lgt') { throw 'no keys were made' }
          function Wait-Up($what) {
            foreach ($i in 1..30) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/healthz | Out-Null; return } catch { Start-Sleep -Seconds 1 }
            }
            Get-Content -ErrorAction SilentlyContinue (Join-Path $env:USERPROFILE '.latch\gateway.log')
            throw "the gateway did not answer $what"
          }
          latch autostart on
          Wait-Up 'after autostart on'
          # Reinstalling runs the uninstall and install hooks, as an update does: the gateway comes back.
          scoop uninstall latch
          scoop install .\pkg\bucket\latch.json
          Wait-Up 'after reinstalling'
          latch uninstall --all
          scoop uninstall latch
          Start-Sleep -Seconds 2
          if (Get-Process -Name latch-gateway -ErrorAction SilentlyContinue) { throw 'the gateway still runs after uninstalling' }
          if (Test-Path (Join-Path $env:USERPROFILE '.latch')) { throw 'uninstall --all left the keys' }

  # And with winget's own local install, as `winget install AspershUpadhyay.Latch` would:
  # the program alone, on the PATH as `latch`, with the latch commands built in (ADR-069).
  winget:
    needs: archives
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { path: dist, pattern: "archive-*", merge-multiple: true }
      - run: packaging/render.sh "$TAG" dist http://127.0.0.1:8000 pkg
        shell: bash
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -WindowStyle Hidden python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1' -WorkingDirectory dist
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is not on this runner' }
          winget --version
          winget settings --enable LocalManifestFiles
          $manifest = Join-Path 'pkg\winget\manifests\a\AspershUpadhyay\Latch' $env:TAG.TrimStart('v')
          winget install --manifest $manifest --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install exited with $LASTEXITCODE" }
          $latch = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\latch.exe'
          if (-not (Test-Path $latch)) { throw "winget did not put latch on the PATH ($latch)" }
          $ErrorActionPreference = 'Continue'
          & $latch version; if ($LASTEXITCODE -ne 0) { throw 'latch version failed' }
          & $latch keys
          & $latch autostart on
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/healthz | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            Get-Content -ErrorAction SilentlyContinue (Join-Path $env:USERPROFILE '.latch\gateway.log')
            Get-Content -ErrorAction SilentlyContinue (Join-Path ([Environment]::GetFolderPath('Startup')) 'Latch gateway.vbs')
            Get-Process -Name latch*, wscript -ErrorAction SilentlyContinue | Format-Table Id, Name, Path
            throw 'the gateway did not answer after latch autostart on'
          }
          & $latch status
          & $latch update
          & $latch uninstall --all
          Start-Sleep -Seconds 2
          if (Get-Process -Name latch, latch-gateway -ErrorAction SilentlyContinue) { throw 'a gateway still runs after latch uninstall' }
          winget uninstall --id AspershUpadhyay.Latch --disable-interactivity
          if (Test-Path $latch) { throw 'winget uninstall left latch' }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Runner images preset ANDROID_SDK_ROOT to another SDK; AGP rejects a mismatch.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.LATCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/latch.jks"
            echo "LATCH_KEYSTORE_PATH=$RUNNER_TEMP/latch.jks" >> "$GITHUB_ENV"
          fi
      - name: Number this release
        run: |
          # vX.Y.Z -> X*1000000 + Y*1000 + Z, so every release is newer than the last
          # and the in-app updater can compare them.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then echo "not a version: $TAG" >&2; exit 1; fi
          IFS=. read -r major minor patch <<< "${TAG#v}"
          echo "LATCH_VERSION_CODE=$(( major * 1000000 + minor * 1000 + ${patch%%[!0-9]*} ))" >> "$GITHUB_ENV"
          echo "LATCH_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
      - working-directory: apps/android
        env:
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
          LATCH_KEY_ALIAS: ${{ secrets.LATCH_KEY_ALIAS }}
          LATCH_KEY_PASSWORD: ${{ secrets.LATCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -Platch.abiSplits=true
      - run: |
          mkdir dist
          # The universal APK keeps the plain name; each chip type's APK gets its ABI in the name.
          for f in apps/android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            abi=${base#app-}; abi=${abi%-release*}
            [[ $abi == universal ]] && abi="" || abi="-$abi"
            cp "$f" "dist/latch-android-${TAG}${abi}$( [[ $f == *unsigned* ]] && echo -unsigned ).apk"
          done
          apks='[]'
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            f="dist/latch-android-${TAG}-$abi.apk"
            [ -f "$f" ] || continue
            apks=$(jq -c \
              --arg abi "$abi" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latch-android-$TAG-$abi.apk" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$f")" \
              '. + [{abi: $abi, url: $url, sha256: $sha, size: $size}]' <<< "$apks")
          done
          # What the app's updater reads from the newest published release; only a signed APK can update.
          apk="dist/latch-android-${TAG}.apk"
          if [ -f "$apk" ]; then
            jq -n \
              --argjson code "$LATCH_VERSION_CODE" \
              --arg name "$LATCH_VERSION_NAME" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latch-android-$TAG.apk" \
              --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$apk")" \
              --arg commit "${GITHUB_SHA::7}" \
              --argjson apks "$apks" \
              '{version_code: $code, version_name: $name, apk_url: $url, sha256: $sha, size: $size, commit: $commit, apks: $apks}' > dist/latch-update.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: android, path: dist/* }

  container:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          # No build-record artifact: it is not a release file.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/latch-gateway:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/latch-gateway:latest
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: env.DRY_RUN != 'true'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/latch-gateway
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [gateway, archives, homebrew, scoop, winget, android, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Only the release files: the run also holds docker's build record, which
      # does not extract (first dry run, 2026-10-15).
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { path: dist, pattern: "{gateway,android,archive-*}", merge-multiple: true }
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/latch-sbom.spdx.json
      - name: Package manifests
        run: |
          packaging/render.sh "$TAG" dist "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" pkg
          cp pkg/Formula/latch.rb dist/latch.rb
          cp pkg/bucket/latch.json dist/latch.json
          tar -czf "dist/latch-$TAG-winget-manifests.tar.gz" -C pkg/winget manifests
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: env.DRY_RUN != 'true'
        with:
          subject-path: dist/*
      - name: Keep the dry run's files
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release-dry-run, path: dist/*, retention-days: 7 }
      - name: Create draft release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Latch $GITHUB_REF_NAME" \
            --notes "Container: ghcr.io/${{ github.repository_owner }}/latch-gateway@${{ needs.container.outputs.digest }}. Verify with: gh attestation verify <file> --repo ${{ github.repository }}. See docs/operations/release.md."
      # The tap (Formula/) and the bucket (bucket/) are this repository: propose the new
      # manifests for main. Merge it after publishing the draft, so the links work.
      - name: Propose the package manifests for main
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="packages/$TAG"
          git fetch --depth=1 origin main
          git switch -c "$branch" FETCH_HEAD
          mkdir -p Formula bucket
          cp pkg/Formula/latch.rb Formula/latch.rb
          cp pkg/bucket/latch.json bucket/latch.json
          git add Formula/latch.rb bucket/latch.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Packages: Homebrew and Scoop for Latch $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Packages: Latch $TAG on Homebrew and Scoop" \
            --body "The Homebrew formula and Scoop manifest for $TAG, made by the release workflow from the published archives. Merge after publishing the $TAG draft release, so brew install latch and scoop install latch find its files. winget: publishing the release runs winget.yml, which submits latch-$TAG-winget-manifests.tar.gz to microsoft/winget-pkgs when the WINGET_TOKEN secret is set (docs/operations/release.md)." \
            || echo "::warning::Could not open the pull request (Settings → Actions → Allow GitHub Actions to create pull requests). The branch $branch holds the manifests."
