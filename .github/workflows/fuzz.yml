name: Fuzz

# Roadmap R29 (e): the protocol and policy parsers under cargo-fuzz. A minute
# per target on changes to them; half an hour per target every week. A crash
# fails the job and its input is uploaded, to add to the fixtures as a test.
on:
  pull_request:
    paths: ["crates/protocol/**", "crates/policy/**", "fuzz/**", "packages/schemas/v1/fixtures/**"]
  push:
    branches: [main]
    paths: ["crates/protocol/**", "crates/policy/**", "fuzz/**", "packages/schemas/v1/fixtures/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [gateway_message, device_message, policy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz
        working-directory: fuzz
        run: |
          ./seed.sh
          seconds=${{ github.event_name == 'schedule' && 1800 || 60 }}
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=$seconds
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
