name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (protocol, policy, gateway, fake device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  interop:
    name: Interop (official MCP TypeScript SDK client)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: scripts/interop.sh

  vercel:
    name: Vercel gateway (contract, typecheck, end-to-end on Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      upstash:
        # Upstash-compatible REST proxy in front of the redis service.
        image: hiett/serverless-redis-http:latest
        ports: ["8079:80"]
        env:
          SRH_MODE: env
          SRH_TOKEN: ci_token
          SRH_CONNECTION_STRING: redis://redis:6379
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Shared contract copies are current
        run: scripts/sync-vercel.sh --check
      - run: cargo build -p latch-fake-device
      - working-directory: servers/vercel
        run: npm ci && npm run typecheck && npm test
      - name: End to end against Redis through the Upstash REST protocol
        working-directory: servers/vercel
        env:
          LATCH_TEST_UPSTASH_URL: http://127.0.0.1:8079
          LATCH_TEST_UPSTASH_TOKEN: ci_token
        run: npx tsx --test test/e2e.test.ts

  android:
    name: Android (build, unit tests, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Runner images preset ANDROID_SDK_ROOT to another SDK; AGP rejects a mismatch.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      # The app's transport and setup tests run against both real gateways.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p latch-gateway
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - working-directory: servers/vercel
        run: npm ci
      - working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v5
        with:
          name: latch-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  container:
    name: Gateway container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t latch-gateway:ci .
      - name: Smoke test
        run: |
          docker run -d --name latch -p 8787:8787 \
            -e LATCH_ADMIN_TOKEN=ci-admin-token-0123456789abcdef0123 \
            -e LATCH_MCP_TOKEN=ci-mcp-token-0123456789abcdef012345 latch-gateway:ci
          for i in $(seq 1 30); do curl -fs localhost:8787/healthz && break; sleep 1; done
          curl -fs localhost:8787/healthz | grep '"status":"ok"'
          docker logs latch
