name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (protocol, policy, gateway, fake device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  interop:
    name: Interop (official MCP TypeScript SDK client)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: scripts/interop.sh

  audit:
    name: Dependency audit (RustSec, npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A known vulnerability in any locked dependency fails the PR.
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - working-directory: servers/vercel
        run: npm audit --audit-level=moderate
      - working-directory: tests/interop
        run: npm audit --audit-level=moderate

  site:
    name: Website, license headers, mirror page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: node scripts/check-site.mjs
      # R30: the live mirror page's frame parsing, codec string, and input mapping.
      - run: node --test servers/mcp/tests/mirror-page.test.cjs
      - run: python3 scripts/headers.py --check

  windows-installer:
    name: Windows gateway installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show active-toolchain || rustup toolchain install
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p latch-gateway
        shell: bash
      # The program alone, as winget installs it (as `latch`): the latch commands are built in (ADR-069).
      - name: The gateway on its own, called latch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'alone'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/latch-gateway.exe (Join-Path $dir 'latch.exe')
          $latch = Join-Path $dir 'latch.exe'
          $env:LATCH_HOME = Join-Path $env:RUNNER_TEMP 'alone-home'
          function Wait-Up($what) {
            foreach ($i in 1..30) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/healthz | Out-Null; return } catch { Start-Sleep -Seconds 1 }
            }
            Get-Content -ErrorAction SilentlyContinue (Join-Path $env:LATCH_HOME 'gateway.log')
            throw "the gateway did not answer $what"
          }
          $ErrorActionPreference = 'Continue'
          & $latch keys; if ($LASTEXITCODE -ne 0) { throw 'latch keys failed' }
          if ((Get-Content -Raw (Join-Path $env:LATCH_HOME 'latch.env')) -notmatch 'LATCH_MCP_TOKEN=lgt_') { throw 'no keys were made' }
          & $latch autostart on; if ($LASTEXITCODE -ne 0) { throw 'autostart on failed' }
          Wait-Up 'after autostart on'
          if ((& $latch autostart status) -notmatch '^on') { throw 'autostart status is not on' }
          & $latch status; if ($LASTEXITCODE -ne 0) { throw 'latch status: not running' }
          & $latch restart
          Start-Sleep -Seconds 2
          Wait-Up 'after restart'
          & $latch autostart off
          Start-Sleep -Seconds 2
          if (Get-Process -Name latch, latch-gateway -ErrorAction SilentlyContinue) { throw 'a gateway still runs after autostart off' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Startup')) 'Latch gateway.vbs')) { throw 'the Startup entry is still there' }
          & $latch uninstall --all
          if (Test-Path $env:LATCH_HOME) { throw 'uninstall --all left the keys' }
      # Windows PowerShell 5.1, what most owners have. The script runs as `irm … | iex` would run it,
      # from a local release: this commit's gateway and scripts.
      - name: Install, start in the background, update, stop, uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item target/release/latch-gateway.exe (Join-Path $rel 'latch-gateway-windows-x86_64.exe')
          Copy-Item packaging/latch.ps1, packaging/latch.cmd $rel
          Get-ChildItem $rel | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ASCII (Join-Path $rel 'latch-gateway.sha256')
          Copy-Item scripts/install-gateway.ps1 $rel
          Start-Process -WindowStyle Hidden python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1' -WorkingDirectory $rel
          # Wait until the local release answers (Python can take a few seconds to start).
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/latch-gateway.sha256 | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          $env:LATCH_RELEASE = 'http://127.0.0.1:8000'

          $bin = Join-Path $env:LOCALAPPDATA 'Latch\bin'
          $latch = Join-Path $bin 'latch.cmd'
          Get-Content -Raw scripts/install-gateway.ps1 | Invoke-Expression
          if (-not (Test-Path (Join-Path $bin 'latch-gateway.exe'))) { throw 'latch-gateway.exe was not installed' }
          & $latch version; if ($LASTEXITCODE -ne 0) { throw 'latch version failed' }
          $keys = Get-Content -Raw (Join-Path $env:USERPROFILE '.latch\latch.env')
          if ($keys -notmatch 'LATCH_MCP_TOKEN=\S+') { throw 'no keys were made' }

          & $latch autostart on
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/healthz | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { Get-Content -ErrorAction SilentlyContinue (Join-Path $env:USERPROFILE '.latch\gateway.log'); throw 'the background gateway did not answer on 127.0.0.1:8787/healthz' }
          & $latch autostart status
          & $latch status

          # `latch update` runs the installer again: the running gateway is replaced, comes back, and the keys stay.
          Remove-Item Env:LATCH_RELEASE
          & $latch update
          if ($LASTEXITCODE -ne 0) { throw "latch update exited with $LASTEXITCODE" }
          if ((Get-Content -Raw (Join-Path $env:USERPROFILE '.latch\latch.env')) -ne $keys) { throw 'reinstalling changed the keys' }
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/healthz | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw 'the background gateway did not come back after reinstalling' }

          & $latch autostart off
          Start-Sleep -Seconds 2
          if (Get-Process -Name latch-gateway -ErrorAction SilentlyContinue) { throw 'the gateway still runs after autostart off' }

          & $latch uninstall --all
          if ($LASTEXITCODE -ne 0) { throw "latch uninstall exited with $LASTEXITCODE" }
          if (Test-Path (Join-Path $bin 'latch-gateway.exe')) { throw 'uninstall left the gateway' }
          if (Test-Path (Join-Path $bin 'latch.cmd')) { throw 'uninstall left the latch command' }
          if (Test-Path (Join-Path $env:USERPROFILE '.latch')) { throw 'uninstall --all left the keys' }

  unix-installer:
    name: macOS and Linux gateway installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # As `curl … | sh` runs it, from a local release: the published beta gateway with this commit's scripts.
      - name: Install, run, update, stop, uninstall
        run: |
          set -eux
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          curl -fsSL -o "$rel/latch-gateway-linux-x86_64" https://github.com/aspershupadhyay/latch/releases/download/beta/latch-gateway-linux-x86_64
          cp packaging/latch "$rel/"
          (cd "$rel" && sha256sum latch-gateway-linux-x86_64 latch > latch-gateway.sha256)
          cp scripts/install-gateway.sh "$rel/"
          (cd "$rel" && exec python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/latch-gateway.sha256 && break; sleep 1; done
          export PATH="$HOME/.local/bin:$PATH"
          LATCH_RELEASE=http://127.0.0.1:8000 sh scripts/install-gateway.sh
          latch version
          grep -q 'LATCH_MCP_TOKEN=lgt' ~/.latch/latch.env
          keys="$(cat ~/.latch/latch.env)"
          latch run >"$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/healthz >/dev/null || { cat "$RUNNER_TEMP/gateway.log"; exit 1; }
          latch status
          # Update installs from the release it came from, and keeps the keys.
          latch update
          [ "$(cat ~/.latch/latch.env)" = "$keys" ]
          test -x ~/.local/bin/latch-start && test -x ~/.local/bin/latch-autostart
          latch stop
          for i in $(seq 10); do pgrep -x latch-gateway || break; sleep 1; done
          if pgrep -x latch-gateway; then echo "the gateway still runs after latch stop"; exit 1; fi
          latch uninstall --all
          test ! -e ~/.local/bin/latch && test ! -e ~/.local/bin/latch-gateway && test ! -e ~/.local/bin/latch-start && test ! -e ~/.latch

  vercel:
    name: Vercel gateway (contract, typecheck, end-to-end on Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      upstash:
        # Upstash-compatible REST proxy in front of the redis service.
        image: hiett/serverless-redis-http:latest
        ports: ["8079:80"]
        env:
          SRH_MODE: env
          SRH_TOKEN: ci_token
          SRH_CONNECTION_STRING: redis://redis:6379
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Shared contract copies are current
        run: scripts/sync-vercel.sh --check
      - run: cargo build -p latch-fake-device
      - working-directory: servers/vercel
        run: npm ci && npm run typecheck && npm run smoke && npm test
      - name: End to end against Redis through the Upstash REST protocol
        working-directory: servers/vercel
        env:
          LATCH_TEST_UPSTASH_URL: http://127.0.0.1:8079
          LATCH_TEST_UPSTASH_TOKEN: ci_token
        run: npx tsx --test test/e2e.test.ts

  android:
    name: Android (build, unit tests, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Runner images preset ANDROID_SDK_ROOT to another SDK; AGP rejects a mismatch.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      # The app's transport and setup tests run against both real gateways.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build -p latch-gateway
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - working-directory: servers/vercel
        run: npm ci
      - working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug createDebugUnitTestCoverageReport
      # R29 (e): JaCoCo coverage of the unit tests, in the job summary and as an artifact.
      - name: Coverage summary
        run: python3 scripts/coverage-summary.py "$(find apps/android/app/build/reports/coverage -name '*.xml' | head -1)" --min-lines 25 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latch-android-coverage
          path: apps/android/app/build/reports/coverage/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latch-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator:
    name: Android emulator (real app, real gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          scripts/setup-android-sdk.sh
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/emulator-test.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-logs
          path: |
            gateway.log
            emulator.log
            logcat.txt
            apps/android/app/build/reports/androidTests/
          retention-days: 7

  container:
    name: Gateway container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t latch-gateway:ci .
      - name: Smoke test
        run: |
          docker run -d --name latch -p 8787:8787 \
            -e LATCH_ADMIN_TOKEN=ci-admin-token-0123456789abcdef0123 \
            -e LATCH_MCP_TOKEN=ci-mcp-token-0123456789abcdef012345 latch-gateway:ci
          for i in $(seq 1 30); do curl -fs localhost:8787/healthz && break; sleep 1; done
          curl -fs localhost:8787/healthz | grep '"status":"ok"'
          docker logs latch
