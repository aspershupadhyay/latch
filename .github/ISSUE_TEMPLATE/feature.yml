name: Feature request
description: Something Latch should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: What do you want to get done?
      description: The task in your words, not the implementation.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: What could go wrong if an AI could do this?
      description: Latch runs on personal phones; every capability needs a safety story.
