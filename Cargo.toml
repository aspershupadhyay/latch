[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/policy",
    "crates/fake-device",
    "servers/mcp",
]
# Needs nightly (cargo-fuzz); built and run by the fuzz job in CI.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/aspershupadhyay/latch"

[workspace.dependencies]
latch-protocol = { path = "crates/protocol" }
latch-policy = { path = "crates/policy" }
latch-fake-device = { path = "crates/fake-device" }

aes = "0.9.3"
axum = { version = "0.8.9", features = ["ws"] }
ctr = "0.10.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hyper = { version = "1.11.1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
qrcode = { version = "0.14.1", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.47", default-features = false, features = ["local-offset", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-std", "io-util", "fs"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "local-time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
